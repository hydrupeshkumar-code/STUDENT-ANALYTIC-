# Render Blueprint — Student Platform
#
# Deploy: Render dashboard → New → Blueprint → pick this repository → Apply.
# Nothing to enter: it deploys with the demo accounts only (see SEED_DEMO below).
#
# One web service (FastAPI API + built React UI, from the Dockerfile) and a managed PostgreSQL
# database. On every start the container runs migrations, then the first-run bootstrap
# (creates the admin from INITIAL_ADMIN_* and optionally loads demo data), then serves on $PORT.

services:
  - type: web
    name: student-analytic
    runtime: docker
    branch: main                    # deploys on every push to main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                      # change to starter or higher for an always-on instance
    region: singapore               # closest Render region to India
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: student-analytic-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true         # strong random secret generated by Render
      - key: WEB_CONCURRENCY
        value: "1"                  # free instances have 512 MB RAM; raise on bigger plans
      - key: TRUSTED_PROXY_HOPS
        value: "1"                  # Render's proxy sits in front; used for login throttling and audit IPs
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      # Demo-only deployment: the demo admin, faculty and student accounts are the only logins.
      # For real use, set SEED_DEMO to "false" and add INITIAL_ADMIN_EMAIL / INITIAL_ADMIN_PASSWORD.
      - key: SEED_DEMO
        value: "true"

databases:
  - name: student-analytic-db
    databaseName: saap
    user: saap
    plan: free                      # free Render Postgres expires after 30 days; use basic-256mb or higher for real use
    region: singapore
    postgresMajorVersion: "16"
